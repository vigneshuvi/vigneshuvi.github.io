<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kite Login Redirect</title>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const status = params.get("status");

        // Redirect only when login status is success.
        if (status === "success") {
          const target = new URL("http://localhost:8080/login");
          target.searchParams.set("request_token", params.get("request_token") || "");
          target.searchParams.set("action", params.get("action") || "");
          target.searchParams.set("type", params.get("type") || "");
          target.searchParams.set("status", status);
          window.location.replace(target.toString());
        }
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f5;
        color: #222;
      }

      main {
        max-width: 540px;
        padding: 24px;
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 10px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.25rem;
      }

      p {
        margin: 8px 0;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Login Redirect</h1>
      <p>If login succeeds, this page redirects to your local app automatically.</p>
      <p>No redirect happens for non-success statuses.</p>
    </main>
  </body>
</html>
